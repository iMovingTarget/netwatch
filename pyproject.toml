[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch"
dynamic = ["version"]
description = "Home-network security monitor for a Linux host: DNS logging and blocking, failed-login detection, LAN device inventory and alerts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergei Papp" }]
requires-python = ">=3.12"
keywords = ["dns", "dnsmasq", "network", "monitoring", "security", "systemd", "homelab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # SSH log parsing and the sliding-window rate tracker (Phase 2). Pinned to a release tag of
    # the author's own project; see "Design decisions" in the README.
    "log-analyzer @ git+https://github.com/iMovingTarget/log-analyzer.git@v0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/iMovingTarget/netwatch"
Issues = "https://github.com/iMovingTarget/netwatch/issues"

[project.scripts]
netwatch = "netwatch.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "netwatch.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
line-ending = "lf"
