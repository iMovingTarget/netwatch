name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14 is what Ubuntu 26.04 (the Netwatch VM) ships; 3.12 and 3.13 keep the install
        # portable to Ubuntu 24.04 and Debian-based hardware.
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest
      - name: Smoke-test the installed entry point
        run: netwatch --version

  deploy:
    name: deploy (shellcheck, unit hardening, install under systemd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Lint shell scripts
        run: shellcheck deploy/*.sh
      - name: Unit hardening stays at exposure 2.0 or lower
        run: systemd-analyze security --offline=yes --threshold=20 deploy/systemd/*.service
      - name: Prepare the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv
          # install.sh runs as root and clones this checkout, which the runner user owns.
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          # Give the commit under test a branch name so a plain clone carries it.
          git branch ci-under-test "$GITHUB_SHA"
      - name: Install this commit with install.sh
        run: sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-under-test
      - name: Service runs hardened under systemd and stops cleanly
        run: |
          set -x
          for unit in deploy/systemd/*.service; do
            sudo systemd-analyze verify "/etc/systemd/system/$(basename "$unit")"
          done
          systemctl status --no-pager netwatch-skeleton.service
          sudo journalctl -u netwatch-skeleton.service --no-pager | grep "revision=$GITHUB_SHA"
          sudo systemctl stop netwatch-skeleton.service
          sudo journalctl -u netwatch-skeleton.service --no-pager | grep "netwatch.skeleton: stopped"
          sudo ls -l /var/lib/netwatch/netwatch.db
      - name: Re-installing the same commit reuses the build
        run: sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-under-test | grep "reusing"
      - name: Uninstall --purge leaves nothing behind
        run: |
          sudo deploy/uninstall.sh --purge
          test ! -e /opt/netwatch
          test ! -e /etc/netwatch
          test ! -e /var/lib/netwatch
          if ls /etc/systemd/system/netwatch* 2>/dev/null; then echo "units left behind"; exit 1; fi
          if getent passwd netwatch; then echo "user left behind"; exit 1; fi
