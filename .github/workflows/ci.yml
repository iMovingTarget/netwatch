name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14 is what Ubuntu 26.04 (the Netwatch VM) ships; 3.12 and 3.13 keep the install
        # portable to Ubuntu 24.04 and Debian-based hardware.
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dnsmasq (the tests that run the real resolver need it)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q dnsmasq-base
      - run: pip install ".[dev]"
      - run: pytest
      - name: Smoke-test the installed entry point
        run: netwatch --version

  monitoring:
    name: monitoring (promtool, compose, metrics format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The compose file is valid; use its Prometheus image for promtool
        run: |
          export GRAFANA_LISTEN=127.0.0.1
          docker compose -f monitoring/compose.yaml config --quiet
          image=$(docker compose -f monitoring/compose.yaml config --images | grep prometheus)
          echo "PROMETHEUS_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Prometheus configuration and alert rules are valid
        run: |
          promtool() { docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/rules/netwatch.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules /etc/prometheus/tests/netwatch.test.yml
      - name: netwatch metrics output passes promtool's checks
        run: |
          pip install .
          export NETWATCH_STATE_DIR="$RUNNER_TEMP/state"
          netwatch dns ingest --from-file examples/dnsmasq-journal.jsonl
          netwatch auth watch --from-file examples/sshd-journal.jsonl
          netwatch devices scan --from-file examples/arp-scans.jsonl
          netwatch metrics | tee metrics.prom
          docker run --rm -i --entrypoint promtool "$PROMETHEUS_IMAGE" check metrics < metrics.prom

  deploy:
    name: deploy (install, DNS, SSH, discovery and metrics end to end, uninstall under systemd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Lint shell scripts
        run: shellcheck deploy/*.sh deploy/bin/netwatch .github/fake-device.sh monitoring/setup.sh
      - name: Unit hardening stays at exposure 2.0 or lower
        run: systemd-analyze security --offline=yes --threshold=20 deploy/systemd/*.service
      - name: Prepare the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv dnsutils openssh-server
          # An sshd to fail logins against (socket-activated on Ubuntu 24.04).
          sudo systemctl start ssh.socket || sudo systemctl start ssh.service
          # install.sh runs as root and clones this checkout, which the runner user owns.
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          # Give the commit under test a branch name so a plain clone carries it.
          git branch ci-under-test "$GITHUB_SHA"
          # A documentation address for dnsmasq to answer on, as the VM answers on its LAN one.
          sudo ip addr add 192.0.2.53/32 dev lo
          # A LAN to scan: a bridge with one device, in a network namespace, plugged in.
          sudo ip link add nwbr0 type bridge
          sudo ip addr add 198.51.100.1/24 dev nwbr0
          sudo ip link set nwbr0 up
          sudo .github/fake-device.sh dev1 198.51.100.23 00:00:5e:00:53:23
          sudo install -d -m 0750 /etc/netwatch
          printf '%s\n' NETWATCH_DNS_LISTEN=192.0.2.53 NETWATCH_DNS_ALLOW_FROM=192.0.2.0/24 \
            NETWATCH_DISCOVERY_INTERFACE=nwbr0 NETWATCH_METRICS_LISTEN=192.0.2.53 \
            NETWATCH_METRICS_ALLOW_FROM=192.0.2.0/24 | sudo tee /etc/netwatch/netwatch.env
      - name: Install this commit with install.sh
        run: sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-under-test
      - name: The CLI from a shell reports the deployed revision
        run: netwatch --version | grep -F "(revision ${GITHUB_SHA:0:12})"
      - name: Services run under systemd, dnsmasq only on the listen address
        run: |
          set -x
          for unit in deploy/systemd/*.service; do
            sudo systemd-analyze verify "/etc/systemd/system/$(basename "$unit")"
          done
          systemctl is-active netwatch-dns.service netwatch-auth.service dnsmasq.service \
            netwatch-blocklist.timer netwatch-discovery.timer
          sudo ss -lnup | grep ':53 '
          if sudo ss -lnup | grep ':53 ' | grep dnsmasq | grep -v '192.0.2.53:53'; then
            echo "dnsmasq listens on more than the configured address"; exit 1
          fi
      - name: DNS answers and blocks, and every query is stored
        run: |
          set -x
          netwatch blocklist status
          netwatch dns check
          dig +short @192.0.2.53 example.com
          sleep 4
          netwatch dns recent -n 20 | tee recent.txt
          grep -E ' forwarded +example\.com ' recent.txt
          grep -E ' blocked ' recent.txt
          netwatch dns top
      - name: Queries made while the logger is stopped are stored when it restarts
        run: |
          set -x
          sudo systemctl stop netwatch-dns.service
          dig +short @192.0.2.53 while-stopped.example.org || true
          sudo systemctl start netwatch-dns.service
          sleep 4
          netwatch dns recent -n 50 | grep while-stopped.example.org
      - name: Failed SSH logins are stored once each and raise one alert
        run: |
          set -x
          for i in 1 2 3 4 5 6; do
            ssh -o BatchMode=yes -o PubkeyAuthentication=no -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null "nwtest$i@127.0.0.1" true || true
          done
          for _ in $(seq 20); do
            if netwatch alerts | grep -q ssh-brute-force; then break; fi
            sleep 1
          done
          netwatch auth recent --failed -n 50 | tee failed.txt
          # Each attempt logs "Invalid user" and a pre-auth disconnect: six attempts, six rows.
          test "$(grep -c '^[0-9-]* [0-9:]*  127\.0\.0\.1 ' failed.txt)" -eq 6
          netwatch alerts | tee alerts.txt
          test "$(grep -c 'ssh-brute-force .*from 127\.0\.0\.1' alerts.txt)" -eq 1
      - name: The first scan is the baseline; a device that appears later alerts once
        run: |
          set -x
          netwatch devices | tee devices.txt
          grep -E '^198\.51\.100\.23 +00:00:5e:00:53:23 .* known ' devices.txt
          if netwatch alerts | grep new-device; then echo "the baseline raised an alert"; exit 1; fi
          # A phone with a private (locally administered) Wi-Fi address joins.
          sudo .github/fake-device.sh dev2 198.51.100.99 02:00:5e:00:53:63
          sudo systemctl start netwatch-discovery.service
          sudo systemctl start netwatch-discovery.service
          netwatch alerts | tee alerts.txt
          test "$(grep -c 'new-device .*02:00:5e:00:53:63 at 198\.51\.100\.99 (locally administered' alerts.txt)" -eq 1
          netwatch devices --unknown | tee unknown.txt
          grep -E '^198\.51\.100\.99 +02:00:5e:00:53:63 .* new ' unknown.txt
          netwatch devices label 02:00:5e:00:53:63 'test phone'
          test "$(netwatch devices --unknown)" = "no unknown devices"
          journalctl -u netwatch-discovery.service --no-pager -o cat | tail -n 8
      - name: node_exporter serves Netwatch's metrics, on the listen address only
        run: |
          set -x
          systemctl is-active prometheus-node-exporter.service netwatch-metrics.timer
          sudo ss -lntp | grep ':9100 '
          if sudo ss -lntp | grep ':9100 ' | grep -v '192.0.2.53:9100'; then
            echo "node_exporter listens on more than the configured address"; exit 1
          fi
          sudo systemctl start netwatch-metrics.service
          curl -fsS http://192.0.2.53:9100/metrics > scraped.txt
          grep -E '^netwatch_dns_queries_total\{status="blocked"\} [1-9]' scraped.txt
          grep -E '^netwatch_ssh_logins_total\{outcome="failed"\} [1-9]' scraped.txt
          grep -E '^netwatch_heartbeat_timestamp_seconds\{component="dns"\}' scraped.txt
          grep -E '^node_systemd_unit_state\{name="netwatch-dns.service",state="active"[^}]*\} 1' scraped.txt
          # The systemd collector reports Netwatch's units and dnsmasq, nothing else.
          if grep -E '^node_systemd_unit_state\{name="ssh' scraped.txt; then
            echo "the systemd collector is not limited to Netwatch's units"; exit 1
          fi
          grep -E '^node_textfile_scrape_error 0' scraped.txt
          # The sandbox must not cost collectors that work without it.
          grep -E '^node_scrape_collector_success\{collector="(timex|systemd|textfile|filesystem)"\} 1' scraped.txt
          test "$(grep -cE '^node_scrape_collector_success\{collector="(timex|systemd|textfile|filesystem)"\} 1' scraped.txt)" -eq 4
          # A run every minute stays out of the journal (LogLevelMax=notice).
          if journalctl -u netwatch-metrics.service --no-pager -o cat | grep -E 'Starting|Finished'; then
            echo "netwatch-metrics logs every run"; exit 1
          fi
          sudo systemd-analyze security prometheus-node-exporter.service | tail -n 1
      - name: The monitoring stack scrapes the Netwatch host end to end
        run: |
          set -x
          printf '%s\n' GRAFANA_LISTEN=127.0.0.1 NETWATCH_TARGET=192.0.2.53:9100 > monitoring/.env
          sudo monitoring/setup.sh | tee setup.txt
          grep -F "target netwatch: up" setup.txt
          query() { curl -fsS --get http://127.0.0.1:9090/api/v1/query --data-urlencode "query=$1"; }
          query 'netwatch_dns_queries_total{instance="netwatch", status="blocked"} > 0' | tee q.json
          grep -F '"status":"blocked"' q.json
          query 'node_systemd_unit_state{name="dnsmasq.service", state="active"}' | grep -F '"1"'
          password=$(sudo cat monitoring/secrets/grafana_admin_password)
          grafana() { curl -fsS -u "admin:$password" "http://127.0.0.1:3000/api/$1"; }
          grafana dashboards/uid/netwatch-overview | grep -F '"title":"Netwatch"'
          grafana dashboards/uid/netwatch-host | grep -F '"title":"Netwatch host"'
          grafana datasources/uid/prometheus/health | grep -F '"status":"OK"'
          # No anonymous access and no sign-up.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/dashboards/uid/netwatch-overview)" = 401
          sudo docker compose -f monitoring/compose.yaml down --volumes
      - name: Scanning needs the service's capability, and says so
        run: |
          if netwatch devices scan 2> scan-error.txt; then echo "scanned without CAP_NET_RAW"; exit 1; fi
          cat scan-error.txt
          grep -F "needs the CAP_NET_RAW capability" scan-error.txt
      - name: Installing a release without device discovery skips it, as a rollback to v0.3.0 does
        run: |
          set -x
          git switch -q -c ci-no-discovery "$GITHUB_SHA"
          git rm -q deploy/systemd/netwatch-discovery.service deploy/systemd/netwatch-discovery.timer
          git -c user.name=CI -c user.email=ci@example.invalid commit -q -m "a release without discovery"
          git switch -q --detach "$GITHUB_SHA"
          sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-no-discovery | tee old.txt
          grep -F "this release has no device discovery" old.txt
          if ls /etc/systemd/system/netwatch-discovery*; then echo "discovery units left"; exit 1; fi
          sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-under-test
          systemctl is-active netwatch-discovery.timer
      - name: Re-installing the same commit reuses the build
        run: sudo NETWATCH_REPO_URL="$GITHUB_WORKSPACE" deploy/install.sh ci-under-test | grep "reusing"
      - name: Uninstall --purge leaves nothing behind
        run: |
          set -x
          sudo deploy/uninstall.sh --purge
          if systemctl is-active --quiet dnsmasq.service; then echo "dnsmasq still running"; exit 1; fi
          if systemctl is-active --quiet prometheus-node-exporter.service; then
            echo "node_exporter still running"; exit 1
          fi
          for path in /opt/netwatch /etc/netwatch /var/lib/netwatch /var/lib/netwatch-blocklist \
                      /etc/dnsmasq.d/netwatch.conf /etc/systemd/system/dnsmasq.service.d/netwatch.conf \
                      /var/lib/netwatch-metrics \
                      /etc/systemd/system/prometheus-node-exporter.service.d/netwatch.conf \
                      /usr/local/bin/netwatch; do
            if [ -e "$path" ]; then echo "left behind: $path"; exit 1; fi
          done
          if ls /etc/systemd/system/netwatch* 2>/dev/null; then echo "units left behind"; exit 1; fi
          if getent passwd netwatch; then echo "user left behind"; exit 1; fi
