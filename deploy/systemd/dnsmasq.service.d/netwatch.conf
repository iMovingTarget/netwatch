# Installed by Netwatch as /etc/systemd/system/dnsmasq.service.d/netwatch.conf.
[Service]
# Netwatch's dnsmasq answers on the LAN address only, never on loopback. Without this, the
# package's start-up hook registers 127.0.0.1 as a resolver for the host itself; on Ubuntu,
# systemd-resolved rejects that with "Failed to set DNS configuration: Link lo is loopback
# device" on every start. DNSMASQ_EXCEPT=lo makes the hook skip it (and adds except-interface=lo).
Environment=DNSMASQ_EXCEPT=lo
# Every query is several log lines. journald's default rate limit (10,000 messages per 30 s per
# unit) could drop some in a burst, and the query log would silently have gaps.
LogRateLimitIntervalSec=0
